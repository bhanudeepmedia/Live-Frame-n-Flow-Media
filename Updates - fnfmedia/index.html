    <script>
      // Each page's first pictures start loading now, not after the page's code has run.
      ;(function () {
        var phone = matchMedia('(max-width: 900px)').matches
        var home = ['/walls/hero-' + (phone ? 'phone' : 'laptop') + '.webp']
        if (phone) home.push('/portfolio/01-the-grafton-vault.webp', '/portfolio/02-therehva.webp', '/portfolio/05-al-mulla-carpentry.webp', '/portfolio/03-zhai-farms.webp')
        // The earth's picture is next in line, behind everything on the first screen.
        var after = phone && location.pathname === '/' ? ['/globe/earth-still.webp'] : []
        var pictures = {
          '/': home,
          '/web-development': ['/pages/web-hero.webp'],
          '/custom-shopify-development': ['/pages/shopify-hero.webp'],
          '/marketing': ['/pages/marketing-hero.webp'],
          '/seo-aeo': ['/pages/seo-search.webp'],
          '/blog': ['/pages/blog-hero.webp'],
          '/offers/website-25k': ['/pages/offer-website.webp'],
        }
        ;(pictures[location.pathname] || []).concat(after).forEach(function (href) {
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = href
          link.fetchPriority = after.indexOf(href) < 0 ? 'high' : 'low'
          document.head.appendChild(link)
        })
      })()
    </script>
